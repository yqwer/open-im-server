# 版本号: 1.1.0
# 修订日期: 2026-08-13
# 作者/生成者: Composer（Cursor）
# 最后修订人: Composer（Cursor）
# 变更说明:
#   - 1.1.0（2026-08-13）: externalAddress 改为 Nginx 网关 https://172.16.52.112:12005。
#   - 1.0.0: 基线（internalAddress 对齐 MinIO 容器网桥 IP）。
#
# Name of the bucket in MinIO
bucket: openim
# Access key ID for MinIO authentication
accessKeyID: root
# Secret access key for MinIO authentication
secretAccessKey: openIM123
# Session token for MinIO authentication (optional)
sessionToken: 
# Internal address of the MinIO server
# 容器内由 IMENV_MINIO_INTERNALADDRESS=minio:9000 覆盖；本值对齐宿主机/Nginx 上游
internalAddress: 172.18.0.3:9000
# External address of the MinIO server, accessible from outside. Supports both HTTP and HTTPS using a domain name
externalAddress: https://172.16.52.112:12005
# Flag to enable or disable public read access to the bucket
publicRead: false

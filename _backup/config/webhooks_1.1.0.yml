# =============================================================================
# OpenIM Webhooks（业务回调）配置
# -----------------------------------------------------------------------------
# 版本号:     1.1.0
# 修订日期:   2026-07-30
# 作者/生成者: Composer (Cursor Auto)
# 最后修订人: Composer (Cursor Auto)
# 变更说明:
#   - 1.0.0: 原始英文注释配置（备份见 backup/config/webhooks_1.0.0.yml）
#   - 1.1.0: 注释改为中文；为各回调补充说明；通用字段在头部统一说明；
#            修复 beforeAddBlack.failedContinue 缺省值（补为 true）
# -----------------------------------------------------------------------------
# 通用字段说明（各回调项下的同名字段含义一致，下文不再逐条重复）：
#   enable          - 是否启用该回调；false 表示不发起 HTTP 回调
#   timeout         - 回调请求超时时间（秒）；超时按失败处理
#   failedContinue  - 回调失败（超时/HTTP 错误/业务拒绝等）时是否继续原业务流程；
#                     true=放行继续，false=阻断并返回失败；after* 类回调通常无此字段
# 过滤字段说明（仅部分回调支持）：
#   deniedTypes     - 消息 contentType 黑名单；列表内类型不触发回调；未配置则全部类型可回调
#   attentionIds    - 关注列表；仅列表内 ID 触发回调；未配置则全部触发
#                     （单聊为 recvID，群聊为 groupID）
# url: 业务方统一回调接收地址（各事件通过请求体区分）
# =============================================================================

url: http://127.0.0.1:10006/callbackExample

# 发送单聊消息前
beforeSendSingleMsg:
  enable: false
  timeout: 5
  failedContinue: true
  deniedTypes: []

